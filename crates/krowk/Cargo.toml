[package]
name = "krowk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[features]
default = []
# The device-side half: krowk.db, import, sync. Off by default so the agent
# build links none of it.
sessions = ["dep:krowk-store", "dep:krowk-import"]
# krowk's own agent engine: `krowk -p`, the session log, the Anthropic
# client. Needs the store it projects into, so it implies `sessions`; the
# agent build links none of it.
# The inline TUI bare `krowk` opens on a terminal comes with it, and
# `krowk sync`'s end-to-end keys (krowk-client): sync is a full-build thing.
harness = ["sessions", "dep:krowk-harness", "dep:krowk-tui", "dep:krowk-client"]

[dependencies]
krowk-api = { path = "../krowk-api" }
krowk-store = { path = "../krowk-store", optional = true }
krowk-import = { path = "../krowk-import", optional = true }
krowk-harness = { path = "../krowk-harness", optional = true }
krowk-tui = { path = "../krowk-tui", optional = true }
# End-to-end keys for `krowk sync` (full build only). Its crates are in its
# own Cargo.toml.
krowk-client = { path = "../krowk-client", optional = true }
serde = { version = "1", features = ["derive"] }
# preserve_order: a record read back keeps the key order it arrived in.
# raw_value: the models.dev file is parsed without building what it skips.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
regex-lite = "0.1"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
jaq-core = "3"
jaq-std = "3"
jaq-json = "2"
# The two pickers (workspace, session) a person at a terminal may be asked.
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
# `krowk upgrade` unpacks the release archive it downloads.
flate2 = "1"
tar = { version = "0.4", default-features = false }
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(unix)'.dependencies]
# Open flags and errnos per target: their values differ by architecture.
libc = "0.2"

[dev-dependencies]
# The stand-in registry, served in-process for the wire-shape pin.
krowk-devregistry = { path = "../krowk-devregistry" }
# The subagent tests drive the host in-process, to interrupt one child
# while its siblings run; the harness already links tokio, so no crate is
# added.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time"] }
