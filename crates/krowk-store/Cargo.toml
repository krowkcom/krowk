[package]
name = "krowk-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
# krowk.db's place in krowk's home, the one function every path comes from.
krowk-api = { path = "../krowk-api" }
# bundled: the SQLite this ships with is the one it was tested with, and a
# machine without libsqlite3 still gets a working krowk.db.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
