# The stand-in for api.krowk.com that the golden cases and the client's own
# tests run against. Test infrastructure: built by no release, never shipped.
[package]
name = "krowk-devregistry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[lib]
name = "krowk_devregistry"

[[bin]]
name = "devregistry"
path = "src/main.rs"

[dependencies]
# Signs relay tickets as the registry does (relay.md → Tickets), through
# krowk-client's `relay_ticket`: crypto lives there alone (R-E2E-2). Test
# infrastructure, so nothing released gains a crate.
krowk-client = { path = "../krowk-client" }
jiff = { version = "0.2", default-features = false, features = ["std"] }
sha2 = "0.11"
tiny_http = "0.12"

[dev-dependencies]
serde_json = "1"
