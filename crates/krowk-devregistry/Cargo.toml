# The stand-in for api.krowk.com that the golden cases and the client's own
# tests run against. Test infrastructure: built by no release, never shipped.
[package]
name = "krowk-devregistry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[lib]
name = "krowk_devregistry"

[[bin]]
name = "devregistry"
path = "src/main.rs"

[dependencies]
# Signs relay tickets as the registry does (relay.md → Tickets). The same
# crate and version krowk-client links, so the build gains nothing; not
# krowk-client itself, which depends on krowk-api, whose tests use this.
ed25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
sha2 = "0.11"
tiny_http = "0.12"

[dev-dependencies]
serde_json = "1"
