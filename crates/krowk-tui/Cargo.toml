# The inline terminal UI bare `krowk` opens on a terminal: a client of the
# harness's in-process protocol and nothing else. Compiled into `krowk` only
# by the `harness` feature, so the agent build links none of it. Every
# dependency here pays rent against full.size and the TUI's RSS budgets.
[package]
name = "krowk-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
krowk-harness = { path = "../krowk-harness" }
# Its one way to run git, linked already through the harness.
krowk-api = { path = "../krowk-api" }
# The inline viewport, its diffing buffer and insert_before (R-TUI-1).
# scrolling-regions: lines go into scrollback through a scroll region
# rather than by clearing and repainting the viewport, so nothing flickers
# and nothing already in scrollback is drawn twice. No default features: no
# layout cache, no macros; the menus use its Table and Block.
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "scrolling-regions"] }
# The same crossterm the pickers already link (through inquire), plus its
# event stream: key presses and resizes wake the loop, nothing polls.
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "windows", "event-stream"] }
futures-core = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "time", "sync", "macros", "net", "signal"] }
serde_json = { version = "1", features = ["preserve_order"] }
unicode-width = "0.2"
# Graphemes, measured as ratatui and the terminal measure them: already
# linked through ratatui.
unicode-segmentation = "1"
# Fuzzy matching for the `/` menu, as Grok Build's is (nucleo). With the
# menus' ratatui Table it adds 161,024 bytes to full.size (7,951,400 ->
# 8,112,424 on x86_64 Linux, 14,040 under the ceiling).
nucleo-matcher = "0.3"
# Code in colour, a fenced block in an answer or a file a call wrote
# (`syntax`): syntect's highlighter over bat's grammars (two-face), which
# have what syntect's own set lacks (TypeScript, TOML, Dockerfile). Pure
# Rust regexes (fancy-regex), no oniguruma to build. Adds 2,225,888 bytes to
# full.size (8,648,392 -> 10,874,280 on x86_64 Linux).
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
# A pasted image's bytes as they travel in a command, and as PowerShell
# hands them over. Already linked, by the harness.
base64 = "0.22"
# A pasted image, made small enough for every provider (`paste`): read as
# PNG, JPEG, GIF or WebP, resized, and written back as PNG or JPEG. No
# rayon; no BMP or TIFF, which a clipboard is asked for as PNG instead
# (237,024 bytes more for the two). Adds 419,616 bytes for PNG and JPEG and
# 165,568 for GIF and WebP: 13,345,000 -> 13,930,184 on x86_64 Linux.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(unix)'.dependencies]
# Ctrl-Z: stopping ourselves with SIGTSTP once the terminal is given back.
libc = "0.2"

[dev-dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "scrolling-regions"] }
