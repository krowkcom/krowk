[package]
name = "gruntas-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
# gruntas.db's place in gruntas's home, the one function every path comes from.
gruntas-api = { path = "../gruntas-api" }
# bundled: the SQLite this ships with is the one it was tested with, and a
# machine without libsqlite3 still gets a working gruntas.db.
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
