[package]
name = "krowk-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
# The ledger's place in krowk's home.
krowk-api = { path = "../krowk-api" }
krowk-store = { path = "../krowk-store" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# opencode keeps its sessions in SQLite, read here read-only.
rusqlite = { version = "0.40", features = ["bundled"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
# Open flags and errnos per target: their values differ by architecture.
libc = "0.2"
