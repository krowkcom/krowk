[package]
name = "krowk-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
# getuid: a home owned by another user is refused. Already linked by the CLI.
libc = "0.2"

[dev-dependencies]
# The stand-in registry, served in-process for the integration tests.
krowk-devregistry = { path = "../krowk-devregistry" }
