# Every performance and size number krowk promises, in one file. `make bench`
# measures each enforced budget and fails when a median lands over its `max`;
# CI runs the same thing on every pull request (R-PERF-7). How a budget is
# measured, and how a pending one is turned on, is in README.md beside this
# file.
#
# A number here is a promise, not a record of the last run: changing one needs
# a line of justification in the pull request that changes it. A measurement
# is compared against the absolute number below, never against a previous run,
# so a slow drift fails as surely as a jump.
#
# Fields:
#   id      what the bench measures; an enforced id must have a measurement
#   req     the requirement it holds the build to
#   what    the line the CI summary prints
#   unit    bytes, count, ms, us, ticks, wakeups, MB or fps
#   max     the budget, the most the median may be; a table of numbers per
#           target ("x86_64-linux", "aarch64-macos", …) where the number
#           depends on the target — a target with no number is reported,
#           not held
#   runs    how many times it is measured; the median is what is compared
#   status  "enforced", or "pending" until the ticket named in `owner`
#           builds the thing it measures

# --- The agent build (no features): what a container fetches or compiles ---

[[budget]]
id = "lean.size"
req = "R-PKG-2"
what = "Agent build (no features): release binary size"
unit = "bytes"
# 3,943,808 bytes (3.76 MiB) with rust 1.97 when this budget was set. The
# headroom is a quarter of a megabyte, so one real new dependency breaks it.
# Provider auth 02 (no new crate: `krowk login`, `logout` and `whoami`, the
# new `auth logout` and the words that point a provider at `krowk connect`)
# adds 7,648 bytes: 3,953,024 (3.77 MiB).
# Provider auth 06 (the short `krowk --help`: the 217-line overview's prose
# moved into command pages and topics) takes 2,176 off: 3,950,848.
# Main measured 4,025,984 before `krowk upgrade` checked the release's
# Sigstore signature (no new crate: rustls-webpki's chain building and
# ring's ECDSA, linked for TLS already, Merkle and checkpoint checks of our
# own, and Sigstore's 6.8 KB trusted_root.json), which adds 36,672 bytes:
# 4,062,656 (3.87 MiB), 131,648 under this. sigstore-rs, the alternative,
# brings its own crypto, x509 and TUF stacks, far past this headroom. Its
# review round 1 (the repository and trigger extensions, the checkpoint's
# origin, 32-byte proof hashes) adds 1,504: 4,064,160, 130,144 under this.
max = { x86_64-linux = 4_194_304 }
status = "enforced"

[[budget]]
id = "lean.deps"
req = "R-PKG-2"
what = "Agent build (no features): crates linked, every target"
unit = "count"
# The length of crates/krowk/lean-deps.txt, which `make lean-deps` holds to
# the exact list; this is the number the promise is stated in.
max = 136
status = "enforced"

# --- The full build (--features harness): everything krowk can link ---

[[budget]]
id = "full.size"
req = "R-OSS-7"
what = "Full build (--features harness): release binary size"
unit = "bytes"
# 6,253,544 bytes (5.96 MiB) when this budget was set. The harness grew from
# there, ticket by ticket: the engines, permissions, subagents, the host
# daemon and its transports, end-to-end sync and the relay, code highlighting,
# image handling, worktrees and direct LAN paths. A ticket that adds a
# dependency raises this in its own PR, with the dependency's cost in the
# justification (bench runs on release only, so a PR's own build is not
# measured until the release run). Main's earlier ceilings are in git history.
# Raised 16.00 -> 20.00 MiB at the maintainer's call, to release 0.16.0: MCP in
# krowk's own agent (OAuth sign-in, persistent connections, images in tool
# results) and images in `krowk -p` and `krowk sync attach`, with no new
# crate.
max = { x86_64-linux = 20_971_520 }
status = "enforced"

# --- Startup: a new process each run, no daemon ---

[[budget]]
id = "startup.version"
req = "R-PERF-1"
what = "Agent build: `krowk --version`, cold process"
unit = "ms"
# ~2.3 ms locally. A tripwire: nothing krowk does before its prompt may cost
# more than printing a version.
max = 15
runs = 21
status = "enforced"

[[budget]]
id = "startup.sessions"
req = "R-PERF-1"
what = "Full build: `krowk sessions` on an empty store, cold process"
unit = "ms"
# ~3.5 ms locally: opening krowk.db and listing it, the picker's first step.
max = 30
runs = 21
status = "enforced"

# --- Idle: no polling and no timers while nothing happens (Linux /proc) ---

[[budget]]
id = "engine.idle_cpu"
req = "R-PERF-2"
what = "`krowk -p` waiting on a silent provider: CPU ticks over 10 s"
unit = "ticks"
max = 0
window_s = 10
status = "enforced"

[[budget]]
id = "engine.idle_wakeups"
req = "R-PERF-2"
what = "`krowk -p` waiting on a silent provider: thread wakeups over 10 s"
unit = "wakeups"
# Stricter than ticks: a timer that wakes for a microsecond a second rarely
# lands on a tick, but it is a context switch every time.
max = 0
window_s = 10
status = "enforced"

[[budget]]
id = "engine.idle_rss"
req = "R-PERF-3"
what = "`krowk -p` waiting on a silent provider: resident memory"
unit = "MB"
# The whole process, held to 30 MB: a silent provider's turn is the most idle
# the engine gets.
max = 30
window_s = 10
status = "enforced"

# --- The session log ---

[[budget]]
id = "log.append"
req = "R-PERF-5"
what = "Session log: one event appended (1 KiB assistant text)"
unit = "us"
max = 1000
runs = 2000
status = "enforced"

# --- The model's context: what every call pays for before the conversation ---

[[budget]]
id = "context.tokens"
req = "R-TOOL-1"
what = "Full build: system prompt plus tool definitions, largest toolset preset (estimated tokens, bytes / 4)"
unit = "tokens"
# An estimate, not a tokenizer's count: four bytes a token, as `krowk -p`
# records it in context.jsonl, measured from `/` so the checkout's path does
# not move it. 1,182 when this budget was set (ticket 03: the gpt preset,
# apply_patch as a JSON tool; claude 1,165, grok 1,178), and about 1,310 for
# apply_patch in its freeform form, which only a wire API with grammar tools
# offers. Ticket 08's `publish` brings them to 1,327 (gpt; claude
# 1,310, grok 1,323), and about 1,450 in the freeform form. Ticket 10 adds
# `todo_write` (R-TOOL-1's list complete) and `subagent`, about 240 tokens
# between them, and takes about 70 back from the existing definitions — an
# optional field's schema is its type alone, a nested type is written in
# place, and a path's field no longer repeats what the system prompt says
# of relative paths: 1,472 (gpt; claude 1,437, grok 1,450), inside 1,500.
# The freeform form, which only a wire API with grammar tools is sent and
# this bench never measures, is held to its own ceiling (1,650) by the
# unit test. Every model call carries these tokens, so a new tool or a
# longer description has to fit here or raise this with a reason. The unit
# test `r_tool_1_the_system_prompt_and_tool_definitions_stay_small` holds
# every preset's JSON form to this same number.
# Ticket 25 (R-TOOL-3) offers `mcp_search` and `mcp_call` when MCP servers
# are configured — two definitions whatever the number of tools, which stay
# deferred until searched for. With three servers they measure 141 tokens:
# 1,613 (gpt; claude 1,578, grok 1,591), inside 1,625. Without MCP servers,
# as this bench runs, nothing changes (1,472). The unit test
# `r_tool_3_the_mcp_meta_tools_fit_the_context_budget_however_many_tools_the_servers_have`
# and the end-to-end test with fifty MCP tools hold that case to this number.
# `ask_user` (questions for the person, with options to pick) is 169 tokens,
# about as small as a list of questions of options can be written: 1,641 with
# no MCP servers (gpt; claude 1,606, grok 1,619), 1,769 with them, so this is
# raised to 1,800. It is offered only where a person can answer, so `krowk -p`,
# which this bench runs, does not carry it and measures 1,472 still; the unit
# tests hold every preset with it. The `subagent` tool's `isolation` field
# (worktrees WT3) is 29 more: 1,670 with no MCP servers (gpt), 1,798 with
# them, and about 1,501 for this bench. Background jobs (R-STEER-2) add
# `bash_output` and `kill_bash` and `bash`'s `run_in_background`, about 115
# tokens the design pins: 1,793 with no MCP servers (gpt), 1,921 with them,
# and about 1,616 for this bench, so this is raised to 1,925. Background
# subagents (R-STEER-3) add `subagent`'s `run_in_background`, 27 more: 1,948
# with MCP servers (gpt), about 1,643 for this bench, so 1,950.
max = 1950
runs = 1
status = "enforced"

# --- Rendering and remote ---

[[budget]]
id = "remote.attach"
req = "R-PERF-6"
what = "Attach from a checkpoint on a remote device"
unit = "ms"
# The sealed index, the checkpoint and ten chunks of tail, read from the
# stand-in registry over loopback HTTP and opened: what a viewer does before
# it goes live (crates/krowk-harness/src/sync/store.rs).
max = 500
runs = 11
status = "enforced"

[[budget]]
id = "remote.resume"
req = "R-PERF-6"
what = "Attach on a remote device from where its last reading stopped"
unit = "ms"
# The sealed index and the five chunks after a kept place (store::resume),
# from the stand-in registry over loopback HTTP: what a viewer holding the
# session's events in its cache reads.
max = 500
runs = 11
status = "enforced"
