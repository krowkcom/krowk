[package]
name = "gruntas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "gruntas"
path = "src/main.rs"

[[bin]]
name = "gruntas-mcp"
path = "src/bin/gruntas-mcp.rs"

[features]
default = []
# The device-side half: gruntas.db, import, sync. Off by default so the agent
# build links none of it.
sessions = ["dep:gruntas-store", "dep:gruntas-import"]
# gruntas's own agent engine: `gruntas -p`, the session log, the Anthropic
# client. Needs the store it projects into, so it implies `sessions`; the
# agent build links none of it.
# `gruntas sync`'s end-to-end keys (gruntas-client): sync is a full-build thing.
harness = ["sessions", "dep:gruntas-harness", "dep:gruntas-client"]

[dependencies]
gruntas-api = { path = "../gruntas-api" }
gruntas-store = { path = "../gruntas-store", optional = true }
gruntas-import = { path = "../gruntas-import", optional = true }
gruntas-harness = { path = "../gruntas-harness", optional = true }
# End-to-end keys for `gruntas sync` (full build only). Its crates are in its
# own Cargo.toml.
gruntas-client = { path = "../gruntas-client", optional = true }
serde = { version = "1", features = ["derive"] }
# preserve_order: a record read back keeps the key order it arrived in.
# raw_value: the models.dev file is parsed without building what it skips.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
regex-lite = "0.1"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
jaq-core = "3"
jaq-std = "3"
jaq-json = "2"
# The two pickers (workspace, session) a person at a terminal may be asked.
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }
# `gruntas upgrade` unpacks the release archive it downloads.
flate2 = "1"
tar = { version = "0.4", default-features = false }
sha2 = "0.11"
# `gruntas upgrade` checks the release's Sigstore signature on checksums.txt
# (cli/upgrade/sigstore.rs) with what TLS already links: rustls-webpki's
# chain building and ring's ECDSA, through ureq's rustls, and the base64
# jaq-std links. No crate is added to the lean build's list.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "alloc"] }
rustls-pki-types = { version = "1", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[target.'cfg(unix)'.dependencies]
# Open flags and errnos per target: their values differ by architecture.
libc = "0.2"

[dev-dependencies]
# The stand-in registry, served in-process for the wire-shape pin.
gruntas-devregistry = { path = "../gruntas-devregistry" }
# The subagent tests drive the host in-process, to interrupt one child
# while its siblings run; the harness already links tokio, so no crate is
# added.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time"] }
# tests/harness_mcp_mobbin.rs shares the Mobbin-shaped fake with the harness tests,
# which checks PKCE and reads forms. Test-only, versions as in gruntas-harness.
base64 = "0.22"
sha2 = "0.11"
url = "2"
