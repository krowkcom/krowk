name: TMP stress (ticket 140)

# TEMPORARY (ticket 140): the two Rust flakes, 200 runs each on macOS and
# Linux runners with the rest of their test binaries looping beside them
# for load. Removed before merge.
on:
  push:
    branches: [krowk/bc5b5d6b]

permissions:
  contents: read

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: check
      - name: tmux on macOS
        if: runner.os == 'macOS'
        run: command -v tmux || brew install tmux
      - name: Build the tests
        run: cargo nextest run --workspace --exclude krowk-golden --features krowk/harness --no-run
      - name: "r_sub_12 and r_tui_3, 200 runs each, under load"
        run: |
          set -o pipefail
          load() {
            while [ ! -e "$RUNNER_TEMP/stop" ]; do
              cargo nextest run -p krowk-harness --test sync_attach --no-fail-fast -E 'not test(=r_sub_12_a_viewer_answers_a_claude_agents_approval_and_nothing_elses)' >/dev/null 2>&1 || true
              cargo nextest run -p krowk --features krowk/harness --test tui --no-fail-fast -E 'not test(=r_tui_3_a_resize_mid_stream_never_repeats_a_line_or_leaves_the_live_region_behind)' >/dev/null 2>&1 || true
            done
          }
          load &
          status=0
          cargo nextest run -p krowk-harness --test sync_attach --no-fail-fast --stress-count 200 \
            -E 'test(=r_sub_12_a_viewer_answers_a_claude_agents_approval_and_nothing_elses)' 2>&1 | grep -vE '^\s+(PASS|SETUP)|^ Stress test|^──' | tail -n 600 || status=1
          cargo nextest run -p krowk --features krowk/harness --test tui --no-fail-fast --stress-count 200 \
            -E 'test(=r_tui_3_a_resize_mid_stream_never_repeats_a_line_or_leaves_the_live_region_behind)' 2>&1 | grep -vE '^\s+(PASS|SETUP)|^ Stress test|^──' | tail -n 600 || status=1
          touch "$RUNNER_TEMP/stop"
          wait
          exit $status
