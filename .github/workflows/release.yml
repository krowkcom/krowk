name: Release

# A tag is the whole trigger. `git tag -a v2026.11.0 -m ... && git push origin v2026.11.0`
# checks the tag, builds both builds of gruntas (full and lean) and gruntas-mcp for
# five platforms in parallel (dist.yml), rebuilds one platform on a second
# runner and refuses to go on unless the bytes match, signs the checksums and
# the SBOMs, opens the GitHub Release with all of it on it, and publishes the
# seven npm packages with provenance and, for a stable release, server.json to
# the MCP registry. SECURITY.md says how to verify each.
#
# Three components, deliberately: the moving `v0` tag this workflow pushes at
# the end is also `v*`, and a release run for `v0` would cut a release of
# version "0" and ask npm to publish it. Which three is the `check` job's
# first step (scripts/release_tag.sh): calendar versions, YYYY.M.N.
on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

# Third-party actions are pinned by commit, for the reason dist.yml gives.

jobs:
  # The release notes, the advisories and the SBOMs. A tag with no
  # CHANGELOG.md section, or a crate with a fresh advisory, stops here in
  # seconds, before anything is built. `make check` itself is `full`'s.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # vYYYY.M.N or vYYYY.M.N-rcK, with no leading zero in the month or N;
      # any other tag stops here, before anything is built or published. The
      # bare assignment is what fails the step: inside `echo` it would not.
      - id: version
        run: |
          v=$(scripts/release_tag.sh "$GITHUB_REF_NAME")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # The release notes are the tag's CHANGELOG.md section, written for the
      # people upgrading, rather than a list of every commit.
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # A pre-release (v2026.11.0-rc1) carries its release's notes, so
          # every rc of one version reads the same CHANGELOG.md section.
          v="${VERSION%%-*}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md \
            || { echo "::error::CHANGELOG.md has no section for $v" >&2; exit 1; }

      # The Claude Code plugin, the Gemini extension and the MCP registry
      # entry are read from main, not from a release, so their versions are
      # bumped by hand in the release commit; 0.12.0 and 0.12.1 shipped
      # without it, and Claude Code offers no plugin update until the
      # version moves. A pre-release keeps the last release's versions.
      - name: Manifests carry the release's version
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          stale=$(
            { jq -r '"\(input_filename) \(.version)"' .claude-plugin/plugin.json gemini-extension.json server.json
              jq -r '.packages[] | "server.json packages[].version \(.version)"' server.json
            } | awk -v v="$VERSION" '$NF != v'
          )
          [[ -z "$stale" ]] || { echo "::error::not at $VERSION: ${stale//$'\n'/, }" >&2; exit 1; }

      # The MCP registry refuses a server.json whose description is over 100
      # characters; the others are held to one line.
      - name: Manifests' descriptions fit where they are listed
        run: node scripts/descriptions_check.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md

      - name: Set up Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      # R-OSS-3: the same advisory and licence check as a pull request, run
      # again at the tag, because an advisory published since the last merge
      # is exactly what should stop a release. First, so it
      # stops one in seconds rather than after the suite.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2,cargo-cyclonedx@0.5.9

      - name: Advisories, licences and sources
        run: cargo deny check

      # R-OSS-3: a CycloneDX SBOM of each build, over every target the
      # release ships. It is a superset of what a binary links — the tool
      # resolves the workspace's features together — so it may name a crate
      # one build leaves out, never the other way round; the exact list for
      # the lean build is crates/gruntas/lean-deps.txt. The timestamp is the
      # tagged commit's, so a rerun writes the same file.
      - name: SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          mkdir -p sbom
          for build in full lean; do
            features=()
            [[ "$build" == full ]] && features=(--features harness)
            cargo cyclonedx --manifest-path crates/gruntas/Cargo.toml --format json --spec-version 1.5 \
              --target all --no-build-deps "${features[@]}" --override-filename sbom
            name="gruntas"
            [[ "$build" == lean ]] && name="gruntas-lean"
            mv crates/gruntas/sbom.json "sbom/${name}_${VERSION}.cdx.json"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/

  # Whether the tag's commit, or an earlier one that differs only by what a
  # release commit changes (*.md and the three manifests), has already passed
  # Full or bench: main's push runs Full on every commit, and bench can be run
  # by hand before tagging
  # (`gh workflow run bench.yml --ref main`). scripts/release_reuse.sh says
  # which commit's run it reused. Full's golden cases there ran on the golden
  # profile, not the release build; the release build's own checks are dist's
  # and reproduce's.
  passed:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      full: ${{ steps.runs.outputs.full }}
      bench: ${{ steps.runs.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 40
          persist-credentials: false

      - id: runs
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          for wf in full bench; do
            echo "$wf=$(scripts/release_reuse.sh "$wf" | tail -n 1)" >> "$GITHUB_OUTPUT"
          done

  # `make check` on every platform, at the tag's commit. A pull request is
  # signed off on one machine and main is checked after the merge, so this is
  # where a release is held to all of them at once, unless main's Full has
  # already done so for this commit.
  full:
    needs: passed
    if: needs.passed.outputs.full != 'true'
    uses: ./.github/workflows/full.yml
    with:
      golden_profile: release

  # R-PERF-7: the budgets are held here rather than on every pull request.
  bench:
    needs: passed
    if: needs.passed.outputs.bench != 'true'
    uses: ./.github/workflows/bench.yml

  # Nothing is built for release until every gate has passed, here or before.
  dist:
    needs: [check, passed, full, bench]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.passed.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.full.result) && contains(fromJSON('["success","skipped"]'), needs.bench.result) }}
    uses: ./.github/workflows/dist.yml
    with:
      version: ${{ needs.check.outputs.version }}

  # R-OSS-3: two independent builds of the same tag produce identical
  # binaries. One target is built again here, on another runner, from a
  # checkout at another path (so the path remapping in scripts/dist.sh is
  # what makes them match, not a shared directory), and the release stops
  # unless every binary matches the one dist built byte for byte. Linux x86-64
  # is the one rebuilt: the build most people and every container fetch.
  reproduce:
    needs: [check, dist]
    # A gate skipped above (it passed before the tag) skips everything after
    # it unless a job says otherwise; a failure anywhere still stops it.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: rebuild

      - name: Set up Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target "$TARGET"
          rustup default 1.97.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-zigbuild@0.23.4

      - name: Build again
        working-directory: rebuild
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: scripts/dist.sh build "$TARGET" "$VERSION"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: released

      - name: The same bytes
        run: |
          set -euo pipefail
          for bin in "$TARGET/gruntas" "$TARGET/gruntas-mcp" "$TARGET-lean/gruntas" "$TARGET-lean/gruntas-mcp"; do
            want=$(sha256sum "released/$bin" | cut -d' ' -f1)
            got=$(sha256sum "rebuild/dist/$bin" | cut -d' ' -f1)
            echo "$bin  released $want  rebuilt $got"
            [[ "$want" == "$got" ]] || { echo "::error::$bin did not build reproducibly" >&2; exit 1; }
            echo "- \`$bin\` \`$want\`, rebuilt identically" >> "$GITHUB_STEP_SUMMARY"
          done

  # The code `gruntas upgrade` checks a signature with, compiled at this tag in
  # a job that can sign nothing and write nothing: the dependencies' build
  # scripts and proc macros run here, never beside the OIDC token or the
  # release's write access. Only the test binary leaves it.
  verifier:
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1

      - name: Build gruntas's unit tests
        run: |
          set -euo pipefail
          bin=$(cargo test --locked -p gruntas --lib --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test and .target.name == "gruntas" and (.target.kind | index("lib"))) | .executable')
          [[ -x "$bin" ]] || { echo "::error::no gruntas unit-test binary was built" >&2; exit 1; }
          mkdir -p verifier && cp "$bin" verifier/gruntas-unit-tests

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verifier
          path: verifier/

  # The one job that can mint the release's identity: it downloads what was
  # built, runs cosign and nothing else, and hands the bundles on. No Rust
  # build and no third-party code but cosign runs here.
  sign:
    needs: [check, dist, reproduce]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Sigstore's keyless signing: GitHub's OIDC token names this workflow at
      # this tag, Fulcio certifies a one-use key for that identity, and the
      # signature is logged in Rekor. No signing key exists to leak.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist

      # Pinned like every other tool here: the bundle `sign-blob` writes and
      # the `verify-blob` command SECURITY.md gives are cosign 3's.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # R-OSS-3: checksums.txt names every archive's SHA-256, so its signature
      # covers them all; each SBOM is signed on its own. A bundle carries the
      # signature, the certificate and the transparency-log entry together,
      # so `cosign verify-blob --bundle` needs nothing else (SECURITY.md).
      # The services come from the signing config in the repository, not the
      # one cosign 3 fetches from Sigstore's TUF repository at signing time
      # by default (--use-signing-config=true): `gruntas upgrade` reads only a
      # Rekor v1 entry with its signed entry timestamp, so a release logged
      # to Rekor v2 because Sigstore moved its default would be one no
      # shipped gruntas upgrades to. .github/sigstore/signing-config.json is
      # TUF's signing_config.v0.2.json as it stood (Fulcio, Rekor v1, the
      # timestamp authority); oss_hygiene pins its hash and TUF version.
      # Runbook — sign fails on a service: refresh the file from TUF; if TUF's
      # names Rekor v2 only, teach cli/upgrade/sigstore.rs Rekor v2 and ship
      # that release first.
      - name: Sign
        run: |
          set -euo pipefail
          for file in dist/checksums.txt dist/*.cdx.json; do
            cosign sign-blob --yes --signing-config .github/sigstore/signing-config.json \
              --bundle "$file.sigstore.json" "$file"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signatures
          path: dist/*.sigstore.json

  # The bundles just written, checked by the code `gruntas upgrade` runs at
  # this tag (the verifier job's test binary), before anything is
  # published: a change in what cosign writes or Sigstore logs fails this
  # release, not every gruntas's next upgrade. Read-only, like the build.
  verify:
    needs: [check, verifier, sign]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signatures
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verifier
          path: verifier

      - name: Check the signature as gruntas upgrade will
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x verifier/gruntas-unit-tests
          GRUNTAS_RELEASE_DIR="$PWD/dist" GRUNTAS_RELEASE_VERSION="$VERSION" verifier/gruntas-unit-tests \
            cli::upgrade::sigstore::tests::r_oss_3_the_release_being_published_verifies_as_gruntas_upgrade_will_check_it \
            --ignored --exact

  publish:
    needs: [check, dist, reproduce, sign, verify]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      # Creates the release and uploads the archives to it.
      contents: write
      # npm's trusted publishing and provenance: the OIDC token names this
      # workflow at this tag on each package it publishes.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signatures
          path: dist

      # A tag like v0.1.0-rc1 becomes a GitHub pre-release, and npm publishes
      # it under the `next` dist-tag rather than `latest`. Re-running on a tag
      # whose release already exists replaces its assets, so a half-finished
      # release — npm published, upload interrupted, or the other way round —
      # is finished by re-running the workflow rather than by deleting it.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          cat >> release-notes.md <<EOF

          ## Install

          \`\`\`bash
          # npm
          npx @gruntas/cli push screenshot.png

          # The installer: the full build on a workstation, the lean one in CI
          # and containers (or with --lean)
          curl -fsSL https://gruntas.com/install | bash

          # Direct download — no runtime, no package manager. gruntas_… is the
          # full build (the agent, sessions); gruntas-lean_… the lean
          # agent-container build.
          curl -sSfL https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/gruntas_${VERSION}_\$(uname -s | tr A-Z a-z)_\$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz \\
            | tar -xz -C /usr/local/bin gruntas gruntas-mcp

          # From source
          cargo install --locked --git https://github.com/$GITHUB_REPOSITORY --tag $tag --features harness gruntas
          \`\`\`

          \`checksums.txt\` covers every archive on this release, and
          \`checksums.txt.sigstore.json\` is its signature. To verify a
          download (with [cosign](https://docs.sigstore.dev/cosign/system_config/installation/)):

          \`\`\`bash
          cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \\
            --certificate-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$tag \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-github-workflow-repository $GITHUB_REPOSITORY \\
            --certificate-github-workflow-trigger push
          sha256sum --check --ignore-missing checksums.txt
          \`\`\`

          The \`.cdx.json\` files are CycloneDX SBOMs of the full and lean
          builds, each signed the same way. SECURITY.md in the repository says
          how to rebuild a release and compare the bytes; this release's
          \`reproduce\` job already did it once for Linux x86-64.
          EOF
          assets=(dist/*.tar.gz dist/*.zip dist/checksums.txt dist/*.cdx.json dist/*.sigstore.json)
          prerelease=()
          case "$tag" in *-*) prerelease=(--prerelease) ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" "${assets[@]}" --title "$tag" --notes-file release-notes.md --verify-tag "${prerelease[@]}"
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Reads the binaries the build above wrote out of dist/, so the npm
      # packages carry the same bytes the checksums cover.
      - name: Assemble the npm packages
        run: node npm/build.mjs

      # Trusted publishing (publishing through the OIDC token above, no stored
      # secret) needs npm 11.5.1 or later; Node 22 ships 10. Pinned, like the
      # actions here.
      - name: Install an npm that supports trusted publishing
        run: npm install -g npm@11.21.3

      # With NPM_TOKEN set, npm/publish.mjs publishes with it; without, through
      # trusted publishing; with neither it fails the step. Provenance either
      # way: npm records, from the OIDC token above, which workflow at which
      # commit published each package, and shows it.
      #
      # NPM_TOKEN is a granular token with publish rights on @gruntas, there
      # because trusted publishers can only be set on packages that already
      # exist. To finish the switch once a release has published all seven:
      #   1. On npmjs.com, for each package in dist/npm/manifest.json (@gruntas/cli,
      #      @gruntas/mcp and the five @gruntas/cli-<platform>), Settings →
      #      Trusted publisher → GitHub Actions: organization gruntas,
      #      repository gruntas, workflow release.yml, no environment.
      #   2. Delete the NPM_TOKEN repo secret, and revoke the token on npmjs.com.
      # The next release publishes through OIDC; a package missing step 1 fails
      # the step and names itself.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node npm/publish.mjs

      # The moving `v0` tag, so `uses: gruntas/gruntas@v0` follows every
      # stable release instead of freezing a workflow on one. Named here, not
      # derived from the version: a calendar version's first number is a year,
      # and `v2026` is a tag nobody uses. It moves once the
      # release exists and npm carries the packages: a tag pointing at bytes
      # nobody can download yet is worse than a tag that lags by a minute.
      #
      # Pushed through the API rather than git, because the checkout above keeps
      # no credentials on disk. A ref moved by GITHUB_TOKEN starts no workflow
      # run either way, and the narrowed trigger above would ignore it.
      - name: Move the v0 tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A prerelease is not what `@v0` should hand an unsuspecting workflow.
          case "$GITHUB_REF_NAME" in
            *-*)
              echo "::notice::$GITHUB_REF_NAME is a prerelease, so v0 stays where it is"
              exit 0
              ;;
          esac
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v0" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/v0" -f sha="$GITHUB_SHA" >/dev/null
          echo "\`v0\` now points at $GITHUB_REF_NAME." >> "$GITHUB_STEP_SUMMARY"

      # The MCP registry entry, io.github.gruntas/gruntas, from the tag's
      # server.json (the check job held its versions to the tag). The registry
      # checks that npm carries @gruntas/mcp at that version naming this entry,
      # so it goes after npm; and last, so a registry that refuses it fails
      # this job visibly with the release, npm and v0 already done,
      # and nothing is taken back. Re-running the job, whose steps above each
      # finish what is half done, publishes it then. A prerelease keeps the
      # entry where it was.
      #
      # mcp-publisher is pinned and checked against its Sigstore signature, as
      # the registry's GitHub Actions guide does. `login github-oidc` trades
      # this job's OIDC token (id-token: write, above) for a registry token
      # for io.github.gruntas/*, so no secret is stored.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ !contains(needs.check.outputs.version, '-') }}
        with:
          cosign-release: v3.1.3

      - name: Download mcp-publisher
        if: ${{ !contains(needs.check.outputs.version, '-') }}
        env:
          MCP_PUBLISHER_VERSION: v1.8.13
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl -fsSL --output "$archive" "$base/$archive"
          curl -fsSL --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$archive"
          tar -xzf "$archive" mcp-publisher

      - name: Publish to the MCP registry
        if: ${{ !contains(needs.check.outputs.version, '-') }}
        run: |
          set -euo pipefail
          name=$(jq -r .name server.json)
          version=$(jq -r .version server.json)
          # A version is published once and refused after that, so a re-run
          # of a release that got this far skips it. Anything but a clean hit
          # publishes and finds out.
          seen=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/${name/\//%2F}/versions/$version" || true)
          if [[ "$seen" == 200 ]]; then
            echo "::notice::$name $version is already on the MCP registry"
            exit 0
          fi
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish
          echo "\`$name\` $version is on the MCP registry." >> "$GITHUB_STEP_SUMMARY"
