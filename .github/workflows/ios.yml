name: iOS

# The iPhone app and its Rust core, on a macOS runner: `make ios-core`
# builds krowk-ffi as a static XCFramework (R-IOS-14), and the app built
# from apps/ios/project.yml runs its UI tests, KrowkKit's and the bindings'
# unit tests on an iPhone simulator (R-IOS-13, R-CLIENT-1). Nothing else
# builds apps/: `make check`, `make signoff` and full.yml never do, and no
# machine of ours has Xcode, so without this a change to krowk-client,
# krowk-api or krowk-ffi could break the app with no signal.
#
# Path-filtered (R-REPO-1): only a pull request or a push to main that
# touches the phone's code, the crates it links, the fake fleet its tests
# run against, or what pins their build starts it. A CLI-only change never
# queues behind macOS runners.
#
# The framework is built once per distinct Rust input. `key` hashes those
# inputs on a cheap Linux runner and looks the hash up in the Actions cache;
# `bindings` runs only on a miss and saves the framework explicitly, before
# the app is tested, so a hit skips the Rust build entirely and a failed
# build never caches. `app` always restores it.
#
# Actions pinned by commit; dist.yml says why.
on:
  pull_request:
    paths:
      - "apps/ios/**"
      - "crates/krowk-ffi/**"
      - "crates/krowk-client/**"
      - "crates/krowk-api/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "mise.toml"
      - ".cargo/**"
      - "scripts/ios_core.sh"
      # The fake fleet the app's tests run against (R-IOS-15): the
      # stand-in registry and the harness that runs it. Not crates/krowk,
      # though the fleet runs the CLI's `devices add` to answer the
      # phone's pairing: a CLI-only change stays off macOS runners, and
      # krowk/tests/sync_pairing_ffi.rs pairs that CLI with krowk-ffi on
      # every make check.
      - "crates/krowk-devregistry/**"
      - "crates/krowk-harness/**"
      - ".github/actions/setup/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "crates/krowk-ffi/**"
      - "crates/krowk-client/**"
      - "crates/krowk-api/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "mise.toml"
      - ".cargo/**"
      - "scripts/ios_core.sh"
      # The fake fleet the app's tests run against (R-IOS-15): the
      # stand-in registry and the harness that runs it. Not crates/krowk,
      # though the fleet runs the CLI's `devices add` to answer the
      # phone's pairing: a CLI-only change stays off macOS runners, and
      # krowk/tests/sync_pairing_ffi.rs pairs that CLI with krowk-ffi on
      # every make check.
      - "crates/krowk-devregistry/**"
      - "crates/krowk-harness/**"
      - ".github/actions/setup/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # Moves with the version apps/ios/README.md names; the app job checks
  # they agree. The sha256 is that release's xcodegen.zip.
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  # Every input that can change the framework: the workspace and its
  # pinned toolchain, every crate (broadly: cheap, and never stale), the
  # script, the package that wraps it, and this file. A CLI-only change
  # that lands on main just moves the key for the next iOS run.
  key:
    runs-on: ubuntu-24.04
    outputs:
      key: ${{ steps.key.outputs.key }}
      hit: ${{ steps.lookup.outputs.cache-hit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The framework's cache key
        id: key
        run: echo "key=ios-core-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'mise.toml', '.cargo/**', 'crates/**', 'scripts/ios_core.sh', 'apps/ios/KrowkCore/Package.swift', '.github/workflows/ios.yml') }}" >> "$GITHUB_OUTPUT"

      - name: Is it built already?
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/ios/KrowkCore/build
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

  # R-IOS-14: `make ios-core`, twice: with the XCFramework assembled by
  # hand as on Linux (omarchy-apple-dev), then as a Mac builds it
  # (`xcodebuild -create-xcframework`), the second reusing the first's
  # cargo builds. The two must be laid out alike; the Mac's is cached.
  bindings:
    needs: key
    if: needs.key.outputs.hit != 'true'
    # Xcode 26 with the iOS 26 SDK and simulators.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Xcode
        run: xcodebuild -version

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same lines as .github/actions/setup, which pins the point
      # release mise.toml names. Its build cache is for the CLI's jobs.
      - name: Set up Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim
          rustup default 1.97.1

      - name: "R-IOS-14: make ios-core with the XCFramework assembled as on Linux"
        run: |
          KROWK_IOS_ASSEMBLE=1 make ios-core
          cp -R apps/ios/KrowkCore/build/KrowkFFI.xcframework "$RUNNER_TEMP/assembled.xcframework"

      - name: "R-IOS-14: make ios-core (xcodebuild -create-xcframework)"
        run: make ios-core

      - name: The hand-assembled XCFramework is laid out as Xcode's
        run: |
          a=apps/ios/KrowkCore/build/KrowkFFI.xcframework b=$RUNNER_TEMP/assembled.xcframework
          diff -r -x Info.plist "$a" "$b"
          python3 - "$a/Info.plist" "$b/Info.plist" <<'EOF'
          import plistlib, sys
          def load(p):
              d = plistlib.load(open(p, "rb"))
              d["AvailableLibraries"].sort(key=lambda l: l["LibraryIdentifier"])
              return d
          a, b = load(sys.argv[1]), load(sys.argv[2])
          if a != b:
              sys.exit(f"Info.plist differs:\nxcodebuild: {a}\nassembled:  {b}")
          EOF

      - name: Cache the framework
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/ios/KrowkCore/build
          key: ${{ needs.key.outputs.key }}

  # R-IOS-13, R-CLIENT-1, R-CLIENT-2, R-IOS-8, R-IOS-9, R-E2E-3, R-HAND-4:
  # the app's Xcode project generates from project.yml with the right
  # settings, builds for a device (unsigned) and for the simulator, and the
  # scheme Krowk-iOS passes ApprovalUITests, LaunchTests, SignInUITests and
  # PairingUITests (XCUITest; pairing asks to send notifications and the
  # simulator's token reaches the fleet's registry, R-IOS-12), KrowkKit's
  # unit tests (PushRegistrationTests among them), the hosted
  # KeychainKeyStorageTests, SignInTests, PairingTests, SessionListTests,
  # RelayConnectionTests (with ticket 86's background, network-change and
  # connect-early checks), TranscriptModelTests, TranscriptTests,
  # LiveFollowTests, ComposerTests, ApprovalMappingTests and
  # ApprovalScreenTests (ConnectionLifecycleTests among KrowkKit's), and KrowkCore's
  # BindingsTests
  # on an iPhone simulator, against the fake fleet
  # (apps/ios/scripts/with-fleet.sh). The app links no WebKit and its
  # sources load no remote image (R-IOS-10); a Release build's owner check
  # is LAContext's alone, and nothing names allowProject (R-IOS-11); the UI tests' stand-in APNs token is a Debug build's only (R-IOS-12). The UI tests' screenshots,
  # light and dark, and one of the running app are kept as artifacts.
  app:
    needs: [key, bindings]
    # Also when bindings was skipped on a cache hit.
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-26
    # The fleet's first build on a cold cache is most of it.
    timeout-minutes: 75
    steps:
      - name: Xcode
        run: |
          xcodebuild -version
          echo "DERIVED=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The host's Rust and the CLI jobs' shared build cache, for the fake
      # fleet: a debug krowk with the harness feature, which answers the
      # phone's pairing, and the fleet itself.
      - name: Set up Rust
        uses: ./.github/actions/setup
        with:
          cache: ios-fleet

      - name: "R-IOS-15: build the fake fleet"
        run: |
          cargo build -p krowk --features harness
          cargo build -p krowk-harness --example fake_fleet
          echo "KROWK_BIN=$GITHUB_WORKSPACE/target/debug/krowk" >> "$GITHUB_ENV"
          echo "KROWK_FLEET_LOG=$RUNNER_TEMP/fake-fleet.log" >> "$GITHUB_ENV"

      - name: The framework the bindings job built
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/ios/KrowkCore/build
          key: ${{ needs.key.outputs.key }}
          fail-on-cache-miss: true

      # The release zip, checked against its sha256, rather than Homebrew,
      # which has no versioned formula: the same XcodeGen on every run.
      - name: XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          grep -q "XcodeGen $XCODEGEN_VERSION" apps/ios/README.md \
            || { echo "apps/ios/README.md does not name XcodeGen $XCODEGEN_VERSION" >&2; exit 1; }
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: "R-IOS-13: xcodegen generate"
        run: |
          test "$(xcodegen --version)" = "Version: $XCODEGEN_VERSION" || { xcodegen --version; exit 1; }
          xcodegen generate --spec apps/ios/project.yml
          # Generated, and ignored: nothing for git to add.
          git check-ignore -q apps/ios/Krowk.xcodeproj/project.pbxproj
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
          xcodebuild -list -project apps/ios/Krowk.xcodeproj -json | jq -e '.project.schemes | index("Krowk-iOS")'

      - name: "R-IOS-13, R-IOS-12: build settings (module KrowkApp, iOS 26.0, iPhone only, no x86_64 simulator slice, the push entitlement)"
        run: |
          xcodebuild -showBuildSettings -project apps/ios/Krowk.xcodeproj -target Krowk-iOS -sdk iphonesimulator -json \
            > "$RUNNER_TEMP/settings.json"
          jq -r '.[0].buildSettings | {PRODUCT_MODULE_NAME, PRODUCT_NAME, PRODUCT_BUNDLE_IDENTIFIER, IPHONEOS_DEPLOYMENT_TARGET,
            TARGETED_DEVICE_FAMILY, EXCLUDED_ARCHS, ARCHS, SWIFT_VERSION, SWIFT_STRICT_CONCURRENCY, CODE_SIGN_ENTITLEMENTS}' "$RUNNER_TEMP/settings.json"
          jq -e '.[0].buildSettings
            | .PRODUCT_MODULE_NAME == "KrowkApp"
              and .IPHONEOS_DEPLOYMENT_TARGET == "26.0"
              and .TARGETED_DEVICE_FAMILY == "1"
              and (.EXCLUDED_ARCHS | split(" ") | index("x86_64"))
              and .SWIFT_VERSION == "6.0"
              and .SWIFT_STRICT_CONCURRENCY == "complete"
              and .CODE_SIGN_ENTITLEMENTS == "Krowk.entitlements"' "$RUNNER_TEMP/settings.json"
          # R-IOS-12: alert pushes, development in the file (the App Store
          # export signs production), and no background modes. xtool.yml
          # names the same file.
          test "$(plutil -extract aps-environment raw apps/ios/Krowk.entitlements)" = development
          grep -qx 'entitlementsPath: Krowk.entitlements' apps/ios/xtool.yml
          for f in apps/ios/Krowk-Info.plist apps/ios/xtool-Info.plist apps/ios/project.yml; do
            test -f "$f"
            if grep -q UIBackgroundModes "$f"; then echo "$f asks for background modes" >&2; exit 1; fi
          done

      # The Secure Enclave wrapping key is the only one a device build has:
      # the software fallback is under #if targetEnvironment(simulator).
      # Unsigned: testflight.yml signs, with the person's key.
      - name: "R-IOS-8: build for a device (generic/platform=iOS)"
        run: |
          xcodebuild build -quiet -skipPackagePluginValidation \
            -project apps/ios/Krowk.xcodeproj -scheme Krowk-iOS \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/DeviceData" COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO
          test "$(lipo -archs "$RUNNER_TEMP/DeviceData/Build/Products/Debug-iphoneos/Krowk.app/Krowk")" = arm64

      # The owner check before an allow is LAContext's in every build a
      # person runs: the UI tests' stub and the launch argument that picks
      # it are under #if DEBUG, so a Release build has neither, and links
      # LocalAuthentication. And no source names allowProject.
      - name: "R-IOS-11, R-IOS-12: a Release build has only the LAContext owner check, no allowProject and no stand-in APNs token"
        run: |
          xcodebuild build -quiet -skipPackagePluginValidation \
            -project apps/ios/Krowk.xcodeproj -scheme Krowk-iOS -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/ReleaseData" COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO
          apps/ios/scripts/approvals.sh "$RUNNER_TEMP/ReleaseData/Build/Products/Release-iphoneos/Krowk.app" release
          apps/ios/scripts/approvals.sh "$RUNNER_TEMP/DeviceData/Build/Products/Debug-iphoneos/Krowk.app" debug

      - name: Boot an iPhone simulator
        run: |
          # An iPhone on the newest iOS runtime installed: the app needs
          # iOS 26, and the image may carry older runtimes too.
          sim=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-[0-9]+-[0-9]+$"))
              | (.key | capture("iOS-(?<a>[0-9]+)-(?<b>[0-9]+)$") | [(.a | tonumber), (.b | tonumber)]) as $v
              | .value[] | select(.name | startswith("iPhone")) | {v: $v, udid, name}]
            | sort_by(.v) | last
            | if . then "\(.udid) \(.name), iOS \(.v | map(tostring) | join("."))" else empty end')
          test -n "$sim" || { echo "no iPhone simulator available" >&2; exit 1; }
          echo "simulator: $sim"
          udid=${sim%% *}
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Build for testing
        run: |
          xcodebuild build-for-testing -quiet -skipPackagePluginValidation \
            -project apps/ios/Krowk.xcodeproj -scheme Krowk-iOS \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$DERIVED" COMPILER_INDEX_STORE_ENABLE=NO
          echo "BUILT=1" >> "$GITHUB_ENV"

      # Against the fake fleet: with-fleet.sh starts it, hands its API URL
      # to the tests (TEST_RUNNER_KROWK_API_URL) and stops it after. Retried
      # only when the simulator failed to start the test runner, a known
      # flake; any other failure fails at once.
      - name: "R-CLIENT-1, R-CLIENT-2, R-IOS-13, R-IOS-8, R-IOS-9, R-CRED-1, R-E2E-3, R-HAND-4, R-IOS-3, R-IOS-7, R-PROTO-2, R-IOS-1, R-LAG-9, R-IOS-10, R-LAG-7, R-PERF-4, R-LAG-8, R-IOS-5, R-PERM-2, R-IOS-11, R-IOS-12, R-IOS-2, R-OFF-2: the scheme's tests on the simulator, against the fake fleet"
        run: |
          set -o pipefail
          for attempt in 1 2 3 4; do
            rm -rf "$RUNNER_TEMP/Tests.xcresult"
            if apps/ios/scripts/with-fleet.sh xcodebuild test-without-building -project apps/ios/Krowk.xcodeproj -scheme Krowk-iOS \
              -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath "$DERIVED" \
              -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" 2>&1 | tee "$RUNNER_TEMP/test.log"; then
              exit 0
            fi
            grep -q "Failed to install or launch the test runner" "$RUNNER_TEMP/test.log" || exit 1
            [ "$attempt" != 4 ] || exit 1
            echo "::warning::attempt $attempt: the simulator failed to launch the test runner; restarting it"
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
          done
          exit 1

      - name: "R-LAG-7, R-PERF-4: the frame-apply baseline and host-to-screen latency (recorded, not a gate)"
        if: ${{ !cancelled() && env.BUILT == '1' }}
        run: |
          test -f "$RUNNER_TEMP/test.log" || exit 0
          {
            echo "### Live follow: recorded on the simulator, not a device budget"
            echo '```'
            grep -oE "(krowk\.frame\.apply baseline|krowk host→screen latency).*|Test Case .*testFrameApplyBaseline.*measured.*" "$RUNNER_TEMP/test.log" | sort -u || echo "no baseline lines in the log"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The UI tests' screenshots (XCTAttachment, kept always), light and
      # dark: onboarding, the approval page, waiting, signed in, pairing, a
      # wrong code, pairing with host A, paired, Sessions, a session's
      # transcript and a tool call expanded in it, a turn followed live
      # (streaming with "↓ New", following again, ended), and the approval
      # sheet, a call allowed and one denied.
      - name: The UI tests' screenshots
        if: ${{ !cancelled() && env.BUILT == '1' }}
        run: |
          r=$RUNNER_TEMP/Tests.xcresult
          test -d "$r" || { echo "no result bundle"; exit 0; }
          out=$RUNNER_TEMP/screenshots
          xcrun xcresulttool export attachments --path "$r" --output-path "$out"
          # Named as the tests named them, not by UUID.
          jq -r '.[].attachments[] | "\(.exportedFileName)\t\(.suggestedHumanReadableName)"' "$out/manifest.json" \
            | while IFS=$'\t' read -r file name; do
                case $name in krowk-*) mv "$out/$file" "$out/${name%%_*}.png" ;; esac
              done
          ls -l "$out"

      - name: Keep the UI tests' screenshots
        if: ${{ !cancelled() && env.BUILT == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: krowk-ios-screenshots
          path: ${{ runner.temp }}/screenshots/krowk-*.png
          if-no-files-found: warn

      - name: The fleet's log on failure
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/fake-fleet.log" || true

      - name: The failing tests
        if: failure()
        run: |
          r=$RUNNER_TEMP/Tests.xcresult
          test -d "$r" || { echo "no result bundle"; exit 0; }
          xcrun xcresulttool get test-results summary --path "$r" | jq '.testFailures'
          xcrun xcresulttool get test-results tests --path "$r" \
            | jq -r '.. | objects | select(.nodeType? == "Test Case" and .result? == "Failed") | .nodeIdentifier // .name'

      - name: Keep the test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Krowk-iOS-xcresult
          path: ${{ runner.temp }}/Tests.xcresult
          if-no-files-found: ignore

      - name: The app is arm64 only, module KrowkApp
        run: |
          app=$DERIVED/Build/Products/Debug-iphonesimulator/Krowk.app
          lipo -archs "$app/Krowk"
          test "$(lipo -archs "$app/Krowk")" = arm64
          test -d "$DERIVED/Build/Products/Debug-iphonesimulator/KrowkApp.swiftmodule"
          plutil -p "$app/Info.plist"
          # Linux's xtool build reads apps/ios/xtool-Info.plist instead of
          # project.yml's INFOPLIST_KEY_*: every key it sets must be in
          # Xcode's, the same. Xcode nests UILaunchScreen in itself, and
          # adds an empty UISceneConfigurations to the scene manifest.
          python3 - "$app/Info.plist" apps/ios/xtool-Info.plist <<'PY'
          import plistlib, sys
          xcode, xtool = (plistlib.load(open(p, "rb")) for p in sys.argv[1:])
          xtool["CFBundleIdentifier"] = "com.krowk.app"  # xtool.yml's bundleID
          scenes = lambda d: d.get("UIApplicationSceneManifest", {}).get("UIApplicationSupportsMultipleScenes")
          bad = [k for k in xtool if k not in ("UILaunchScreen", "UIApplicationSceneManifest")
                 and (k not in xcode or xcode[k] != xtool[k])]
          if "UILaunchScreen" not in xcode:
              bad.append("UILaunchScreen")
          if scenes(xtool) is None or scenes(xcode) != scenes(xtool):
              bad.append("UIApplicationSupportsMultipleScenes")
          if bad:
              sys.exit("xtool-Info.plist differs from Xcode's: " + ", ".join(f"{k}: {xcode.get(k)!r} vs {xtool.get(k)!r}" for k in bad))
          print("xtool-Info.plist agrees with Xcode's on", len(xtool), "keys")
          PY

      - name: "R-IOS-10: no web view, no remote image: the sources, and every Mach-O file in the app"
        run: apps/ios/scripts/no-web.sh "$DERIVED/Build/Products/Debug-iphonesimulator/Krowk.app"

      - name: Screenshot of the running app
        id: shot
        # After a failed test too, when it says the most; not without an app.
        if: ${{ !cancelled() && env.BUILT == '1' }}
        run: |
          app=$DERIVED/Build/Products/Debug-iphonesimulator/Krowk.app
          test -d "$app" || { echo "no Krowk.app was built" >&2; exit 1; }
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          # A fresh install: no install marker, so the first launch clears
          # whatever the tests left in the Keychain, and opens on sign-in.
          xcrun simctl uninstall "$UDID" com.krowk.app || true
          xcrun simctl install "$UDID" "$app"
          # Each appearance set before a launch: a running app doesn't
          # reliably redraw when it changes.
          for look in dark light; do
            xcrun simctl terminate "$UDID" com.krowk.app 2>/dev/null || true
            xcrun simctl ui "$UDID" appearance "$look"
            # The DEBUG build's own override too: this simulator does not
            # reliably follow its appearance setting.
            SIMCTL_CHILD_KROWK_APPEARANCE=$look xcrun simctl launch "$UDID" com.krowk.app
            sleep 5
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/krowk-launch-$look.png"
          done
          # A crashed app would leave the home screen in the picture.
          xcrun simctl spawn "$UDID" launchctl list | grep -q 'UIKitApplication:com\.krowk\.app' \
            || { echo "krowk is not running after 5 s" >&2; exit 1; }

      - name: Keep the screenshot
        if: ${{ !cancelled() && steps.shot.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: krowk-ios-screenshot
          path: ${{ runner.temp }}/krowk-launch-*.png
          if-no-files-found: warn
