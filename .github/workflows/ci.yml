name: CI

# The gate every pull request passes, whatever branch it targets: `make check`
# on Linux x86, cut into jobs that run side by side, so a push is answered in
# the time of the slowest piece rather than the sum. The other platforms and
# the budgets are platforms.yml's and release.yml's, off the review loop.
#
# A push that lands on a branch still being checked cancels the check: only
# the newest commit of a pull request is worth an answer. Documentation alone
# starts nothing.
on:
  pull_request:
    paths-ignore: &docs
      - "*.md"
      - LICENSE
      - THIRD-PARTY-NOTICES
  push:
    branches: [main]
    paths-ignore: *docs

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Clippy over all three builds, and the agent build's dependency list.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: lint

      - name: Clippy, every build
        run: make lint lean-deps

  # The ci profile retries a failed test twice: one that then passes is
  # reported FLAKY instead of failing the job.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: test

      - name: Unit and integration tests
        run: make test
        env:
          NEXTEST_PROFILE: ci

  golden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # `git describe` stamps the version the golden cases mask; a shallow
          # clone without tags still describes, just less precisely.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: golden

      - name: Golden cases
        run: make golden

  # R-OSS-3: every crate both builds link, on every target the release ships,
  # held to deny.toml — no RustSec advisory, no licence outside its list,
  # nothing from outside crates.io. On every pull request, because a
  # dependency bump is where a bad crate arrives; the release runs it again.
  deny:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # cargo deny reads the graph through `cargo metadata`, so the same
      # toolchain as the rest.
      - name: Set up Rust
        run: |
          rustup toolchain install 1.97 --profile minimal
          rustup default 1.97

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Advisories, licences and sources
        run: cargo deny check

  # R-BACK-3: krowk drives `codex app-server`, and the schema of that
  # protocol is pinned in crates/krowk-harness/schema/codex/ for the Codex
  # version beside it. This installs exactly that Codex and fails when the
  # pinned copy no longer matches what it generates — a hand edit, or a pin
  # moved without regenerating. Generating needs no login and reads none.
  codex-schema:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install the pinned Codex
        run: npm install -g "@openai/codex@$(cat crates/krowk-harness/schema/codex/VERSION)"

      - name: The pinned app-server schema is current
        run: make codex-schema
