name: Platforms

# `make check` on the platforms ci.yml leaves out: Linux arm64 and macOS. The
# golden cases are exactly the kind of test a platform difference breaks
# (temp paths, file modes, what the machine's own tables say), but macOS
# runners are few and queue behind every open pull request, so this runs
# after the merge rather than in the review loop: on every push to main, the
# newest cancelling the one before.
#
# A pull request that touches something platform-shaped asks for it up front
# with the `full-ci` label, or by hand:
#   gh workflow run platforms.yml --ref <branch>
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - LICENSE
      - THIRD-PARTY-NOTICES
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # `git describe` stamps the version the golden cases mask; a shallow
          # clone without tags still describes, just less precisely.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: check

      # The ci profile retries a failed test twice: one that then passes is
      # reported FLAKY instead of failing the job.
      - name: Lint, unit tests and golden cases
        run: make check
        env:
          NEXTEST_PROFILE: ci
