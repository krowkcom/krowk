# krowk: the CLI, its MCP server, the session store and importers, and the
# stand-in registry the tests run against. tests/golden holds the binaries to
# their recorded transcripts.
#
# Crates split where a dependency has to stop, not by layer: the default
# `krowk` build is the agent-container one and never links sqlite, so it stays
# small and has nothing to fail on; `--features sessions` adds the store.
[workspace]
resolver = "3"
members = ["crates/*", "tests/golden"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
publish = false

# Size is a requirement here, not a nicety: this binary is fetched into
# someone else's container at the end of their task. "s" rather than "z":
# measured on 707 real sessions, "s" imports ~28% faster than "z" (10.0 s
# against 13.5 s) and as fast as "3", for 0.7 MB more; "3" costs 1.9 MB
# beyond "s" and buys nothing measurable.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# krowk-bench, the tool that measures the release binaries: optimised, so the
# log append it times runs at release speed, but without the LTO pass that
# makes a release build of the harness take minutes. Nothing ships with it.
[profile.bench-tool]
inherits = "release"
lto = false
codegen-units = 16

# `make dev`, the build a person runs while working on krowk: release code
# without the LTO pass and the single codegen unit that make a release
# rebuild take about a minute. An edit rebuilds in seconds. Nothing ships
# with it; sizes and timings are the release profile's (`make bench`).
[profile.quick]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256
incremental = true
strip = false

# `make golden` under `make signoff`: the quick build in a directory of its
# own, so a golden run neither replaces the `krowk` that `make dev` links nor
# relinks target/release. The cases compare output, and the quick build
# writes the same output, two release links faster. full.yml holds the
# release build to the cases after the merge (GOLDEN_PROFILE=release).
[profile.golden]
inherits = "quick"

# Builds and tests while working: line tables, so a panic still names the
# line, and no debuginfo at all for dependencies. Full debuginfo made every
# one of the ~70 test binaries slower to compile and to link, for a debugger
# few runs ever attach.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The signatures every relay join checks twice, optimized even here: at
# opt-level 0 one costs milliseconds, so a test relay meeting fifty hosts
# at once falls behind as no built relay would.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3
