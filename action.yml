# action.yml — the GitHub Action face of the CLI: `uses: gruntas/gruntas@v0`,
# or a release tag where a workflow wants the version frozen.
#
# It is a composite of two bash steps, install then push, because that is all
# the action does: put the binary on the runner and run the same `gruntas push`
# a person would. Everything the CLI detects on its own — repo, commit, branch,
# the pull request from GITHUB_REF, the agent, the session from GITHUB_RUN_ID —
# it detects here too, so the useful invocation is just `files:`.
name: Gruntas
description: >-
  Upload screenshots, videos and other agent output to Gruntas and get permalinks
  back — ready to paste into a pull request comment.
branding:
  icon: upload
  color: gray-dark

inputs:
  files:
    description: >-
      Files to upload — paths or globs, separated by whitespace or newlines.
      Globs support ** (e.g. screenshots/**/*.png).
    required: true
  token:
    description: >-
      A workspace API key, so the uploads land in your workspace instead of
      expiring after 24 hours. Pass a secret; without it the push is keyless.
    required: false
  version:
    description: >-
      The CLI version to install, e.g. 0.8.0. Wins over whatever the action's
      own ref implies. Defaults to the release the ref names, or the latest.
    required: false
  run-slug:
    description: Attach the uploads to this existing run instead of opening one.
    required: false
  title:
    description: Title for the work this push belongs to, recorded on the run.
    required: false
  pull-request:
    description: >-
      Pull request URL the work belongs to. Only needed when the workflow does
      not run on the pull request itself — on pull_request events it is
      detected from GITHUB_REF.
    required: false

outputs:
  urls:
    description: One artifact URL per line, in the order the files were given.
    value: ${{ steps.push.outputs.urls }}
  markdown:
    description: >-
      The registry's markdown paste block for all uploads — what to put in a
      pull request comment.
    value: ${{ steps.push.outputs.markdown }}
  run-slug:
    description: The run the uploads were recorded under, e.g. run_8Kd2wq.
    value: ${{ steps.push.outputs.run-slug }}
  json:
    description: >-
      The JSON envelope from `gruntas push --json`, with claim tokens and
      breadcrumbs stripped so it is safe to paste.
    value: ${{ steps.push.outputs.json }}

runs:
  using: composite
  steps:
    - name: Install gruntas
      shell: bash
      env:
        GRUNTAS_VERSION: ${{ inputs.version }}
        # The runner already has its skills; installing one here would write
        # into a throwaway home directory anyway.
        GRUNTAS_SKIP_SKILL: "1"
      run: |
        set -euo pipefail
        if [ "${RUNNER_OS:-}" = "Windows" ]; then
          echo "::error::This action supports Linux and macOS runners" >&2
          exit 1
        fi
        # No version asked for and the action pinned to a release tag: install
        # that release, so pinning the action pins the binary too. Any other
        # ref — the moving v0 tag, main, a SHA, a branch — has no release of
        # its own, so latest it is.
        if [ -z "${GRUNTAS_VERSION:-}" ]; then
          case "${GITHUB_ACTION_REF:-}" in
            v[0-9]*.[0-9]*.[0-9]*) export GRUNTAS_VERSION="${GITHUB_ACTION_REF#v}" ;;
          esac
        fi
        # Whose releases to install. A remote `uses: owner/repo@ref` names its
        # repository in GITHUB_ACTION_REPOSITORY, and that is the answer — never
        # the calling workflow's repository, which has no gruntas releases. The
        # runner fetches the whole repository for it, so the checkout test below
        # would pass there too, which is why it comes second. `uses: ./` and a
        # `run:` step name no action repository: a checkout of this project
        # installs its own repository's releases (either side of a rename, or a
        # fork), and anything else — a vendored copy — the canonical ones.
        if [ -z "${GRUNTAS_REPO:-}" ]; then
          if [ -n "${GITHUB_ACTION_REPOSITORY:-}" ]; then
            GRUNTAS_REPO="$GITHUB_ACTION_REPOSITORY"
          elif [ -d "${GITHUB_ACTION_PATH:?}/crates/gruntas" ]; then
            GRUNTAS_REPO="${GITHUB_REPOSITORY:-gruntas/gruntas}"
          else
            GRUNTAS_REPO="gruntas/gruntas"
          fi
        fi
        export GRUNTAS_REPO
        export GRUNTAS_BIN_DIR="$RUNNER_TEMP/gruntas-bin"
        mkdir -p "$GRUNTAS_BIN_DIR"
        # Already on PATH before the installer runs, so its setup_path leaves
        # the runner's dotfiles alone — a self-hosted runner keeps its .bashrc.
        export PATH="$GRUNTAS_BIN_DIR:$PATH"
        # The installer ships with the action itself — the runner already has
        # this repo on disk at GITHUB_ACTION_PATH — so pinning the action pins
        # the installer, with no fetch to go stale and nothing hard-coded that
        # GitHub Enterprise would not resolve. The binary is pinned by the
        # version resolved above.
        # A runner is CI, so this is the lean build either way; asked for by
        # name so a self-hosted runner without CI set gets it too.
        bash "${GITHUB_ACTION_PATH:?}/scripts/install.sh" --lean
        echo "$GRUNTAS_BIN_DIR" >> "$GITHUB_PATH"
        # `@v0` resolved to the latest release just now, which is what that tag
        # means: the release workflow moves `v0` to every stable release, and a
        # calendar version (2026.11.0) promises nothing about compatibility for
        # a major line to guard. Breaking changes are announced in the
        # CHANGELOG a release ahead; pin a release tag to stay put.

    - name: Push files
      id: push
      shell: bash
      env:
        GRUNTAS_TOKEN: ${{ inputs.token }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_RUN: ${{ inputs.run-slug }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_PULL_REQUEST: ${{ inputs.pull-request }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        # globstar arrived in bash 4; macOS runners resolve `shell: bash` to
        # the stock 3.2. Plain globs still work there, so only a pattern that
        # actually says ** should fail — and say why.
        globstar_ok=1
        shopt -s globstar 2>/dev/null || globstar_ok=

        # jq parses the envelope below. Hosted runners ship it; a container or
        # self-hosted runner may not, and the failure should say so.
        command -v jq >/dev/null || { echo "::error::jq is required and is not on this runner" >&2; exit 1; }

        # Mask the token even when it did not come from a secret, so a gruntas
        # error that echoes configuration cannot surface it in the log.
        [ -n "$GRUNTAS_TOKEN" ] && echo "::add-mask::$GRUNTAS_TOKEN"

        # Split the input into patterns with globbing off, so an unmatched
        # pattern survives to be named in the error instead of vanishing under
        # nullglob; then expand each one with globbing back on. The input is
        # whitespace-separated — a path with a space in it reaches gruntas
        # through a glob.
        set -f
        read -d '' -ra patterns <<<"$INPUT_FILES" || true
        set +f
        files=()
        for pattern in "${patterns[@]}"; do
          case "$pattern" in *'**'*) [ -n "$globstar_ok" ] || {
            echo "::error::'$pattern' needs ** globs, and this bash ($BASH_VERSION) predates them — use single-level globs, or bash 4+" >&2
            exit 1
          };; esac
          matched=($pattern)
          if [ ${#matched[@]} -eq 0 ]; then
            echo "::error::No file matches '$pattern'" >&2
            exit 1
          fi
          # nullglob only drops unmatched *globs* — a literal path survives
          # expansion whether it exists or not. And what gruntas pushes is
          # files, so a directory a glob swept up is an error here, where the
          # pattern can be named, not later in gruntas's own words.
          for f in "${matched[@]}"; do
            if [ -f "$f" ]; then
              continue
            elif [ -e "$f" ]; then
              echo "::error::Not a file: '$f' (matched by '$pattern')" >&2
            else
              echo "::error::No file matches '$pattern'" >&2
            fi
            exit 1
          done
          files+=("${matched[@]}")
        done
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::The 'files' input is empty" >&2
          exit 1
        fi

        args=(push "${files[@]}" --json)
        [ -n "$INPUT_RUN" ] && args+=(--run "$INPUT_RUN")
        [ -n "$INPUT_TITLE" ] && args+=(--title "$INPUT_TITLE")
        [ -n "$INPUT_PULL_REQUEST" ] && args+=(--pull-request "$INPUT_PULL_REQUEST")

        out=$(gruntas "${args[@]}")

        # Multi-line values go through the heredoc form of GITHUB_OUTPUT. The
        # delimiter is random so no artifact caption can terminate it early.
        emit() {
          local name="$1" value="$2"
          local eof
          eof="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          printf '%s<<%s\n%s\n%s\n' "$name" "$eof" "$value" "$eof" >> "$GITHUB_OUTPUT"
        }

        # A keyless push answers with claim tokens — the capability to claim
        # or delete the upload. Mask each one, then strip them (and the
        # breadcrumbs that quote them) before anything reaches an output a
        # later step might paste into a PR comment.
        jq -r '.. | .claim_token? // empty' <<<"$out" | while IFS= read -r t; do
          echo "::add-mask::$t"
        done
        out=$(jq 'del(.breadcrumbs) | del(.data.artifacts[]?.claim_token)' <<<"$out")

        emit json "$out"
        emit urls "$(jq -r '.data.artifacts[]?.url // empty' <<<"$out")"
        emit markdown "$(jq -r '.paste.markdown // ""' <<<"$out")"
        printf 'run-slug=%s\n' "$(jq -r '.data.run.slug // ""' <<<"$out")" >> "$GITHUB_OUTPUT"

        # The summary makes the links clickable without a PR comment step.
        {
          echo "### Gruntas uploads"
          echo
          jq -r '.data.artifacts[]? | "- \(.url)"' <<<"$out"
        } >> "$GITHUB_STEP_SUMMARY"
