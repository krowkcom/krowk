# How `make test` runs the tests. nextest runs every test in a process of its
# own, so a `static` lock in a test binary no longer keeps its tests one at a
# time: the groups and overrides below do.

# A scratch KROWK_HOME for every test (scripts/test_home.sh), so no test
# makes the developer's own ~/.krowk. Setup scripts are the one way nextest
# sets a variable for every test process; the Makefile does the doctests.
experimental = ["setup-scripts"]

[scripts.setup.test-home]
command = "scripts/test_home.sh"

[[profile.default.scripts]]
filter = "all()"
setup = "test-home"

[test-groups]
# Each drives a real backend or daemon through a shared stand-in and holds a
# SERIAL lock under cargo test.
claude-backend = { max-threads = 1 }
codex-backend = { max-threads = 1 }
switch = { max-threads = 1 }

[profile.default]
# A hung test is named after a minute and stopped after five.
slow-timeout = { period = "60s", terminate-after = 5 }

# The long tail starts first. The symlink-race tests run thousands of tool
# calls each (up to two minutes), and a relay conformance one over a minute;
# started last, as they were, the rest of the run waited on them. Started
# first, they run alongside it.
[[profile.default.overrides]]
filter = "binary(r192b_escapes) | binary(relay_conformance)"
priority = 100

[[profile.default.overrides]]
filter = "binary(claude_backend)"
test-group = "claude-backend"

[[profile.default.overrides]]
filter = "binary(codex_backend)"
test-group = "codex-backend"

[[profile.default.overrides]]
filter = "binary(switch)"
test-group = "switch"

# The no-lag tests measure time: each runs with nothing else on the machine,
# as cargo test ran them (one binary at a time, ONE_AT_A_TIME within it).
[[profile.default.overrides]]
filter = "binary(daemon_ws)"
threads-required = "num-test-threads"

# CI: a test that fails and then passes is reported FLAKY and the job goes on,
# instead of the whole job being run again. One that fails three times fails.
# Only the tests named below are retried, each a flake seen on a loaded runner
# and not yet pinned down: any other test fails the first time, so a new flake
# is found the day it appears, not hidden by a retry. A test leaves this list
# when its cause is fixed.
[profile.ci]
fail-fast = false
failure-output = "immediate-final"

[[profile.ci.overrides]]
filter = """
    (binary(tui) & (
        test(=r_tui_1_a_menu_opened_and_closed_on_a_short_session_puts_nothing_in_scrollback)
        | test(=r_off_1_a_cut_network_shows_the_notice_within_two_seconds_and_nothing_hangs)
        | test(=resume_continues_an_earlier_session_from_the_slash_menu)
        | test(=new_after_a_resume_at_start_keeps_to_the_directory)))
    | (binary(harness_subagents) & (test(/^r_sub_1_r_sub_2_r_sub_3/) | test(/^r_sub_6/)))
    | (binary(sync_attach) & test(/^r_sync_2_a_bridge_whose_lease_another_device_took_stops/))
    | (binary(daemon_ws) & test(/^r_lag_4_r_lag_10_/))
"""
retries = { backoff = "fixed", count = 2, delay = "1s" }

# `make quick-check`, the edit loop: every test but the five that take a
# minute or more, each a race or a relay run many times over. `make check`
# and `make signoff` run them.
[profile.quick]
default-filter = """
    not (
        (binary(r192b_escapes) & (
            test(=r192b_3_planted_secrets_stay_unreadable)
            | test(=r192b_3_write_tool_symlink_race_stays_in_the_workspace)
            | test(=r192b_9_r_perm_3_credentials_stay_hidden_with_the_workspace_inside_the_home)
            | test(=r192b_14_r_perm_3_parent_symlink_races_and_hardlinks)))
        | (binary(relay_conformance) & test(=r_relay_1_a_workspaces_own_tickets_cannot_crowd_another_channels_host_out)))
"""
